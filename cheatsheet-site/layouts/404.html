{{ define "main" }}
<main id="main" class="not-found">
  <p class="not-found-code">404</p>
  <h1>Page not found.</h1>
  <p class="lede">The address may have changed or the document has moved. Look for it again from the home page.</p>
  <div class="hero-actions">
    <a class="btn btn-primary" href="{{ site.Home.RelPermalink }}">Back to home</a>
    <a class="btn btn-ghost" href="{{ "search/" | relURL }}">Search documents</a>
  </div>
</main>
{{ end }}
