baseURL = "https://agnusdei1207.github.io/cheatsheet/"
title = "Cheatsheet"
locale = "ko"
defaultContentLanguage = "ko"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true

[pagination]
  pagerSize = 10

[minify]
  disableXML = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[params]
  env = "production"
  title = "Cheatsheet"
  description = "OSCP 준비를 위한 치트시트, 방법론, 도구 모음"
  author = "agnusdei1207"
  tagline = "Cheatsheet"
  keywords = ["OSCP", "치트시트", "방법론", "도구", "모의해킹", "침투테스트"]
  github = "https://github.com/agnusdei1207/cheatsheet"

  [[params.sections]]
    name = "치트시트"
    path = "/oscp-cheatsheet/"
    description = "열거부터 권한 상승, Active Directory, 리포트까지. 시험장에서 바로 꺼내 쓰는 명령어 레퍼런스."
    icon = "terminal"

  [[params.sections]]
    name = "방법론"
    path = "/methodology/"
    description = "어디서 시작하고 무엇을 확인할지. 공격 순서와 판단 기준을 정리한 글."
    icon = "route"

  [[params.sections]]
    name = "도구"
    path = "/tools/"
    description = "BloodHound, Impacket 등 실제 침투 테스트에서 쓰는 도구의 설치와 사용법."
    icon = "tool"

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = true
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = false
    style = "github-dark"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[privacy]
  [privacy.x]
    disable = false
    simple = true
