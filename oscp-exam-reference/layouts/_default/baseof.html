<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}" data-theme="dark">
<head>
  {{ partial "head.html" . }}
</head>
<body data-search-index="{{ "index.json" | relURL }}">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app">
    {{ partial "sidebar.html" . }}
    <div class="sidebar-overlay" data-nav-close aria-hidden="true"></div>

    <div class="main">
      {{ partial "topbar.html" . }}
      {{ block "main" . }}{{ end }}
      {{ partial "footer.html" . }}
    </div>
  </div>

  {{- $js := resources.Get "js/site.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
