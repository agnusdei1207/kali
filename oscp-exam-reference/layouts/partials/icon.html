{{- $name := .name -}}
{{- $size := .size | default 18 -}}
<svg class="icon icon-{{ $name }}" width="{{ $size }}" height="{{ $size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {{- if eq $name "terminal" -}}
  <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
  {{- else if eq $name "route" -}}
  <circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>
  {{- else if eq $name "tool" -}}
  <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
  {{- else if eq $name "search" -}}
  <circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/>
  {{- else if eq $name "menu" -}}
  <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
  {{- else if eq $name "close" -}}
  <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
  {{- else if eq $name "sun" -}}
  <circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  {{- else if eq $name "moon" -}}
  <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
  {{- else if eq $name "arrow-right" -}}
  <line x1="4" y1="12" x2="20" y2="12"/><polyline points="14 6 20 12 14 18"/>
  {{- else if eq $name "arrow-left" -}}
  <line x1="20" y1="12" x2="4" y2="12"/><polyline points="10 6 4 12 10 18"/>
  {{- else if eq $name "chevron-right" -}}
  <polyline points="9 18 15 12 9 6"/>
  {{- else if eq $name "chevron-down" -}}
  <polyline points="6 9 12 15 18 9"/>
  {{- else if eq $name "copy" -}}
  <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
  {{- else if eq $name "check" -}}
  <polyline points="20 6 9 17 4 12"/>
  {{- else if eq $name "github" -}}
  <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77 5.44 5.44 0 0 0 3.5 8.55c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
  {{- else if eq $name "file" -}}
  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>
  {{- else if eq $name "compass" -}}
  <circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
  {{- else if eq $name "brand" -}}
  <rect x="2" y="2" width="20" height="20" rx="4.4" fill="currentColor" stroke="none"/>
  <polyline points="6.5 8.6 9.5 12 6.5 15.4" stroke="#00ff41" stroke-width="1.7" fill="none"/>
  <line x1="11.5" y1="15.4" x2="16.5" y2="15.4" stroke="#00ff41" stroke-width="1.7" fill="none"/>
  {{- end -}}
</svg>
