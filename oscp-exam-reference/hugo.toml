baseURL = "https://agnusdei1207.github.io/kali/"
title = "Cheatsheet"
locale = "en"
defaultContentLanguage = "en"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[params]
  env = "production"
  title = "Cheatsheet"
  description = "Cheatsheets, methodology, and tools for OSCP preparation"
  author = "agnusdei1207"
  tagline = "Cheatsheet"
  keywords = ["OSCP", "cheatsheet", "methodology", "tools", "penetration testing", "pentesting"]
  github = "https://github.com/agnusdei1207/kali"

  [[params.sections]]
    name = "Cheatsheet"
    path = "/oscp-cheatsheet/"
    description = "From enumeration to privilege escalation, Active Directory, and reporting. Command references you can pull up right in the exam."
    icon = "terminal"

  [[params.sections]]
    name = "Methodology"
    path = "/methodology/"
    description = "Where to start and what to check. Articles outlining attack order and decision criteria."
    icon = "route"

  [[params.sections]]
    name = "Tools"
    path = "/tools/"
    description = "Installation and usage of tools used in real penetration tests, such as BloodHound and Impacket."
    icon = "tool"

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = false
    style = "dracula"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[privacy]
  [privacy.x]
    disable = false
    simple = true
