{{ define "main" }}
<div class="content-wrap">
  <main id="main" class="content search-page">
    <header class="section-header">
      <p class="section-kicker">검색</p>
      <h1>문서 검색</h1>
      <p class="lede">제목, 명령어, 본문 내용을 함께 검색합니다. 여러 단어는 띄어쓰기로 구분하세요.</p>
    </header>

    <form class="search-box" role="search" onsubmit="return false">
      <label class="sr-only" for="search-input">검색어</label>
      {{ partial "icon.html" (dict "name" "search" "size" 19) }}
      <input id="search-input" type="search" name="q" placeholder="{{ .Params.placeholder | default "예: kerberoasting, 리버스 쉘, BloodHound" }}" autocomplete="off" spellcheck="false" autofocus>
    </form>

    <p class="search-status" id="search-status" role="status" aria-live="polite">검색 준비 중…</p>
    <div class="search-results" id="search-results"></div>

    <noscript>
      <p class="search-empty">검색을 사용하려면 JavaScript를 켜 주세요.</p>
    </noscript>
  </main>
</div>
{{ end }}

{{ define "scripts" }}
  {{- $js := resources.Get "js/search.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
{{ end }}
